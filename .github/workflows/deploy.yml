name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Firebase environment
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
        run: |
          if [ -n "$VITE_FIREBASE_API_KEY" ]; then
            echo "VITE_FIREBASE_API_KEY: SET"
          else
            echo "VITE_FIREBASE_API_KEY: MISSING"
          fi

          if [ -n "$VITE_FIREBASE_AUTH_DOMAIN" ]; then
            echo "VITE_FIREBASE_AUTH_DOMAIN: SET"
          else
            echo "VITE_FIREBASE_AUTH_DOMAIN: MISSING"
          fi

          if [ -n "$VITE_FIREBASE_PROJECT_ID" ]; then
            echo "VITE_FIREBASE_PROJECT_ID: SET"
          else
            echo "VITE_FIREBASE_PROJECT_ID: MISSING"
          fi

          if [ -n "$VITE_FIREBASE_STORAGE_BUCKET" ]; then
            echo "VITE_FIREBASE_STORAGE_BUCKET: SET"
          else
            echo "VITE_FIREBASE_STORAGE_BUCKET: MISSING"
          fi

          if [ -n "$VITE_FIREBASE_MESSAGING_SENDER_ID" ]; then
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID: SET"
          else
            echo "VITE_FIREBASE_MESSAGING_SENDER_ID: MISSING"
          fi

          if [ -n "$VITE_FIREBASE_APP_ID" ]; then
            echo "VITE_FIREBASE_APP_ID: SET"
          else
            echo "VITE_FIREBASE_APP_ID: MISSING"
          fi

          if [ -n "$VITE_ADMIN_EMAILS" ]; then
            echo "VITE_ADMIN_EMAILS: SET"
          else
            echo "VITE_ADMIN_EMAILS: MISSING"
          fi

      - name: Build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_ADMIN_EMAILS: ${{ secrets.VITE_ADMIN_EMAILS }}
        run: npm run build


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4