name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ AIzaSyAF1CapjqxpKJvynX7bStHg0idnQsPj5sw }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ ten-ten-ecommerce.firebaseapp.com }}
          VITE_FIREBASE_PROJECT_ID: ${{ ten-ten-ecommerce }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ ten-ten-ecommerce.firebasestorage.app }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ 698196303300 }}
          VITE_FIREBASE_APP_ID: ${{ 1:698196303300:web:6d57ef3ad32fd9900b5891 }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4