- name: Setup Node
  uses: actions/setup-node@v4
  with:
    node-version: 24
    cache: npm

- name: Install dependencies
  run: npm install --include=dev

- name: Verify Vite
  run: |
    node --version
    npm --version
    npm list vite
    ls node_modules/.bin
    npx vite --version

- name: Build
  run: npm run build